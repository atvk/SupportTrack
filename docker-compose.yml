services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supporttrack-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      POSTGRES_SSL: "false"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-supporttrack}"
      POSTGRES_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-supporttrack}"
      POSTGRES_PRISMA_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-supporttrack}"
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma generate && npm run dev"

  db:
    image: postgres:16-alpine
    container_name: supporttrack-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-supporttrack}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_create_users_table.sql:/docker-entrypoint-initdb.d/01_create_users_table.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-supporttrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  app_node_modules:
